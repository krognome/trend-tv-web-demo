name: Deploy static site to GitHub Pages

# This repo holds a pre-built static snapshot of Trend TV's webOS/Tizen/
# VIDAA web demo (apps/tv-web in the source monorepo). It is not a
# development copy — see README.md for how to refresh it. This workflow
# just republishes whatever static files are committed here.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
